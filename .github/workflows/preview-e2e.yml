name: Preview E2E

# Runs the environment-independent E2E suites (smoke, security headers, i18n) against every
# successful Vercel Preview deployment. Preview deployments sit behind Vercel Deployment
# Protection; the automation bypass secret is sent as x-vercel-protection-bypass.
on:
  deployment_status:

permissions:
  contents: read

jobs:
  e2e:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment != 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_BASE_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/smoke.spec.ts e2e/security.spec.ts e2e/i18n-cache.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: preview-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
