name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Build-time placeholders; no external service is contacted during CI.
  NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
  NEXT_PUBLIC_APP_URL: http://localhost:3100
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Lint, format, typecheck, schema
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: demircucu_shadow
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      # Main and shadow must be different databases (P3025); the drift check only uses the shadow.
      DATABASE_URL: postgresql://postgres:postgres@localhost:54329/postgres
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:54329/demircucu_shadow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - name: Prisma schema is valid and formatted
        run: |
          npx prisma validate
          npx prisma format
          git diff --exit-code prisma/schema.prisma
      - name: Migrations match schema (drift check)
        run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --exit-code

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: demircucu_test
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:54329/demircucu_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:integration

  build:
    name: Build (read-only database)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: demircucu_dev
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:54329/demircucu_dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Migrate and seed
        env:
          DATABASE_URL: ${{ env.ADMIN_DATABASE_URL }}
          DIRECT_URL: ${{ env.ADMIN_DATABASE_URL }}
        run: |
          npx prisma migrate deploy
          npm run db:seed
      # Cache Components prerenders content at build time. The build connects with a role that
      # can only read (BYPASSRLS because every table has RLS without policies): any write fails.
      - name: Create read-only build role
        run: |
          docker exec -i ${{ job.services.postgres.id }} psql -U postgres -d demircucu_dev -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE build_reader LOGIN PASSWORD 'build_reader' BYPASSRLS;
          GRANT USAGE ON SCHEMA public TO build_reader;
          GRANT SELECT ON ALL TABLES IN SCHEMA public TO build_reader;
          ALTER ROLE build_reader SET default_transaction_read_only = on;
          SQL
      - name: Build
        env:
          DATABASE_URL: postgresql://build_reader:build_reader@localhost:54329/demircucu_dev
          DIRECT_URL: postgresql://build_reader:build_reader@localhost:54329/demircucu_dev
        run: npm run build
      - name: The build role really cannot write
        run: |
          if PGPASSWORD=build_reader docker exec -e PGPASSWORD -i ${{ job.services.postgres.id }} \
            psql -h localhost -U build_reader -d demircucu_dev -c 'DELETE FROM "Comment"'; then
            echo "build_reader could write" && exit 1
          fi

  supabase:
    name: Supabase (RLS, auth trigger) and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The local Supabase ports (54321-54329) lie inside Linux's default ephemeral range
      # (32768-60999), so an outgoing connection of an earlier step can hold one of them and
      # `supabase start` then fails with "address already in use". Move the ephemeral range
      # above them before anything opens connections.
      - name: Keep ephemeral ports away from the Supabase ports
        run: sudo sysctl -w net.ipv4.ip_local_port_range="60000 65000"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Start local Supabase (auth, API gateway, PostgREST, Storage, Mailpit)
        run: >-
          npx supabase start
          -x realtime,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Supabase tests (RLS, grants, Data API, auth.users trigger)
        run: npm run test:supabase
      - run: npm run e2e:prepare
      - run: npm run e2e:build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
