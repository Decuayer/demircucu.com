# Local development and test databases (plain PostgreSQL, matching production major version).
# Usage: npm run db:up  /  npm run db:down
services:
  postgres:
    image: postgres:17-alpine
    container_name: demircucu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: demircucu_dev
    ports:
      - "54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d demircucu_dev"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
